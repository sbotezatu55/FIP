<div class="app-shell">
  <header class="app-header">
    <div class="app-header__inner">
      <a class="app-brand" routerLink="/" aria-label="Flight Intelligence Platform home">
        <span class="app-brand__mark">FIP</span>
        <span class="app-brand__name">FLIGHT<br />INTELLIGENCE<br />PLATFORM</span>
      </a>

      <nav class="app-nav" aria-label="Main navigation">
        <a routerLink="/" routerLinkActive="app-nav__link--active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
        <a routerLink="/flights" routerLinkActive="app-nav__link--active">Flights</a>
        <a routerLink="/features" routerLinkActive="app-nav__link--active">Features</a>
        <a routerLink="/technology" routerLinkActive="app-nav__link--active">Technology</a>
      </nav>

      <a class="app-github" href="https://github.com/sbotezatu55/FIP" target="_blank" rel="noopener noreferrer" aria-label="Open FIP on GitHub">
        <span aria-hidden="true">↗</span> GitHub
      </a>
    </div>
  </header>

  <main class="app-main">
  <router-outlet />
  </main>

  <footer class="app-footer">
    <div class="app-footer__inner">
      <span>© {{ currentYear }} Flight Intelligence Platform</span>
      <nav aria-label="Footer navigation">
        <a routerLink="/privacy">Privacy</a>
        <a routerLink="/terms">Terms</a>
        <a routerLink="/contact">Contact</a>
      </nav>
    </div>
  </footer>
</div>
