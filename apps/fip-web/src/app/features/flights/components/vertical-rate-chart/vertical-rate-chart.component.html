<div class="vertical-rate-chart-shell">
  @if (chartPoints.length === 0) {
    <p class="chart-empty" role="status">Vertical-rate data is unavailable for this flight.</p>
  } @else {
    <div class="chart-container">
      <canvas #chartCanvas aria-label="Aircraft vertical-rate profile" role="img"></canvas>
    </div>
  }
</div>
