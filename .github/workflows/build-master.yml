name: Build FIP master

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET solution
        run: dotnet restore FIP.sln

      - name: Build .NET solution
        run: dotnet build FIP.sln -c Release --no-restore

      - name: Test .NET solution
        run: dotnet test FIP.sln -c Release --no-build --no-restore --logger trx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/fip-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/fip-web
        run: npm ci

      - name: Build frontend
        working-directory: apps/fip-web
        run: npm run build -- --configuration production
