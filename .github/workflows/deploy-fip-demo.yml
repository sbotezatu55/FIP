name: Deploy FIP demo

on:
  push:
    branches:
      - fip-demo
  workflow_dispatch:

concurrency:
  group: fip-demo-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, fip-demo]
    timeout-minutes: 30
    env:
      API_PROJECT: src\Hosts\Fip.Api\Fip.Api.csproj
      FRONTEND_DIST: apps\fip-web\dist\fip-web\browser
      SITE_ROOT: C:\inetpub\wwwroot\ATS.FIP
      FRONTEND_DEST: C:\inetpub\wwwroot\ATS.FIP\WEB
      API_DEST: C:\inetpub\wwwroot\ATS.FIP\API
      BACKUP_ROOT: C:\inetpub\backups\ATS.FIP

    steps:
      - name: Require fip-demo workflow ref
        shell: powershell
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/fip-demo') {
            throw "This workflow must be started from the fip-demo branch. Actual ref: $env:GITHUB_REF"
          }

      - name: Checkout fip-demo
        uses: actions/checkout@v4
        with:
          ref: fip-demo
          fetch-depth: 0
          clean: true

      - name: Verify checked out revision
        shell: powershell
        run: |
          $expectedCommit = (git rev-parse refs/remotes/origin/fip-demo).Trim()
          $actualCommit = (git rev-parse HEAD).Trim()

          if ($actualCommit -ne $expectedCommit) {
            throw "The deployment checkout is not the current origin/fip-demo revision."
          }

          Write-Host "Deploying fip-demo commit $actualCommit"

      - name: Runner diagnostics
        shell: powershell
        run: |
          whoami
          Write-Host "Runner=$env:RUNNER_NAME"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/fip-web/package-lock.json

      - name: Toolchain diagnostics
        shell: powershell
        run: |
          dotnet --info
          node --version
          npm --version

      - name: Restore API
        shell: powershell
        run: dotnet restore "$env:API_PROJECT"

      - name: Install frontend dependencies
        working-directory: apps/fip-web
        shell: powershell
        run: npm ci

      - name: Build API
        shell: powershell
        run: dotnet build "$env:API_PROJECT" -c Release --no-restore

      - name: Build frontend
        working-directory: apps/fip-web
        shell: powershell
        run: npm run build -- --configuration production

      - name: Prepare deployment staging
        shell: powershell
        run: |
          $deploymentRoot = Join-Path $env:RUNNER_TEMP "fip-deploy-$env:GITHUB_RUN_ID"

          if (Test-Path -LiteralPath $deploymentRoot) {
            Remove-Item -LiteralPath $deploymentRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $deploymentRoot -Force | Out-Null
          "DEPLOY_ROOT=$deploymentRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish API to staging
        shell: powershell
        run: |
          $apiStage = Join-Path $env:DEPLOY_ROOT 'API'
          dotnet publish "$env:API_PROJECT" -c Release --no-build --no-restore -o $apiStage

      - name: Copy frontend build to staging
        shell: powershell
        run: |
          $frontendStage = Join-Path $env:DEPLOY_ROOT 'WEB'
          New-Item -ItemType Directory -Path $frontendStage -Force | Out-Null
          Copy-Item -Path (Join-Path $env:FRONTEND_DIST '*') -Destination $frontendStage -Recurse -Force

      - name: Validate deployment staging
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $apiStage = Join-Path $env:DEPLOY_ROOT 'API'
          $frontendStage = Join-Path $env:DEPLOY_ROOT 'WEB'

          $requiredFiles = @(
            (Join-Path $apiStage 'web.config'),
            (Join-Path $apiStage 'appsettings.json'),
            (Join-Path $frontendStage 'index.html'),
            (Join-Path $frontendStage 'web.config')
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required staged deployment file is missing: $file"
            }
          }

          if (Get-ChildItem -LiteralPath $env:DEPLOY_ROOT -Recurse -Directory |
              Where-Object { $_.Name -in @('bin', 'obj') }) {
            throw 'The staging output contains bin or obj directories.'
          }

          Write-Host 'API and frontend staging validation succeeded.'

      - name: Back up current IIS directories
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $timestamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $backupPath = Join-Path $env:BACKUP_ROOT "$timestamp-$env:GITHUB_RUN_ID"
          $webBackup = Join-Path $backupPath 'WEB'
          $apiBackup = Join-Path $backupPath 'API'

          try {
            foreach ($destination in @($env:FRONTEND_DEST, $env:API_DEST)) {
              if (-not (Test-Path -LiteralPath $destination -PathType Container)) {
                throw "Required IIS deployment directory does not exist: $destination"
              }
            }

            New-Item -ItemType Directory -Path $webBackup, $apiBackup -Force | Out-Null

            robocopy $env:FRONTEND_DEST $webBackup /E /COPY:DAT /DCOPY:DAT /R:2 /W:2 /NFL /NDL /NJH /NJS /NP
            $webCode = $LASTEXITCODE
            if ($webCode -gt 7) {
              throw "WEB backup failed with ROBOCOPY code $webCode."
            }
            $global:LASTEXITCODE = 0

            robocopy $env:API_DEST $apiBackup /E /COPY:DAT /DCOPY:DAT /R:2 /W:2 /NFL /NDL /NJH /NJS /NP
            $apiCode = $LASTEXITCODE
            if ($apiCode -gt 7) {
              throw "API backup failed with ROBOCOPY code $apiCode."
            }
            $global:LASTEXITCODE = 0

            if (-not (Test-Path -LiteralPath $webBackup -PathType Container) -or
                -not (Test-Path -LiteralPath $apiBackup -PathType Container)) {
              throw 'Backup verification failed because one or more backup directories are missing.'
            }

            "DEPLOY_BACKUP=$backupPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Created deployment backup: $backupPath"
          } catch {
            throw "Backup failed before IIS was modified. $($_.Exception.Message)"
          }

          exit 0

      - name: Deploy, verify, and roll back on failure
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-RelativeFiles {
            param(
              [Parameter(Mandatory = $true)][string]$Root,
              [string[]]$ExcludedFilePatterns = @()
            )

            if (-not (Test-Path -LiteralPath $Root -PathType Container)) {
              return @()
            }

            $rootFull = [IO.Path]::GetFullPath($Root).TrimEnd('\')
            $files = @(
              Get-ChildItem -LiteralPath $rootFull -File -Recurse |
                Where-Object {
                  $excluded = $false
                  foreach ($pattern in $ExcludedFilePatterns) {
                    if ($_.Name -like $pattern) {
                      $excluded = $true
                      break
                    }
                  }

                  -not $excluded
                } |
                ForEach-Object {
                  $_.FullName.Substring($rootFull.Length).TrimStart('\')
                }
            )

            return $files
          }

          function Get-SafePath {
            param(
              [Parameter(Mandatory = $true)][string]$Root,
              [Parameter(Mandatory = $true)][string]$RelativePath
            )

            $rootFull = [IO.Path]::GetFullPath($Root).TrimEnd('\') + '\'
            $targetFull = [IO.Path]::GetFullPath((Join-Path $Root $RelativePath))

            if (-not $targetFull.StartsWith($rootFull, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Refusing to access a path outside deployment root: $RelativePath"
            }

            return $targetFull
          }

          function Remove-ManagedFilesNotInSet {
            param(
              [Parameter(Mandatory = $true)][string]$Root,

            [AllowEmptyCollection()]
            [AllowNull()]
            [string[]]$CurrentFiles = @(),

            [AllowEmptyCollection()]
            [AllowNull()]
            [string[]]$AllowedFiles = @(),

              [string[]]$ProtectedPatterns = @()
            )

            foreach ($relativePath in $CurrentFiles) {
              if ([string]::IsNullOrWhiteSpace($relativePath) -or
                  $AllowedFiles -contains $relativePath) {
                continue
              }

              $normalizedPath = $relativePath.Replace('/', '\').TrimStart('\')
              $pathSegments = $normalizedPath -split '\\'
              $fileName = [IO.Path]::GetFileName($normalizedPath)
              $isPersistentPath =
                @('upload', 'uploads', 'log', 'logs', 'App_Data') |
                  Where-Object { $pathSegments -contains $_ } |
                  Select-Object -First 1

              $isDatabaseFile = $normalizedPath -match '\.(db|sqlite|sqlite3|mdf|ndf|ldf|bak)$'
              $isProtectedConfiguration = $false
              foreach ($pattern in $ProtectedPatterns) {
                if ($fileName -like $pattern) {
                  $isProtectedConfiguration = $true
                  break
                }
              }

              if ($isPersistentPath -or $isDatabaseFile -or $isProtectedConfiguration) {
                continue
              }

              $targetPath = Get-SafePath -Root $Root -RelativePath $relativePath
              if (Test-Path -LiteralPath $targetPath -PathType Leaf) {
                Remove-Item -LiteralPath $targetPath -Force
              }
            }
          }

          function Copy-Tree {
            param(
              [Parameter(Mandatory = $true)][string]$Source,
              [Parameter(Mandatory = $true)][string]$Destination,
              [string[]]$ExcludedFiles = @()
            )

            $robocopyArguments = @($Source, $Destination, '/E', '/R:2', '/W:2', '/NFL', '/NDL', '/NJH', '/NJS', '/NP')
            if ($ExcludedFiles.Count -gt 0) {
              $robocopyArguments += '/XF'
              $robocopyArguments += $ExcludedFiles
            }

            & robocopy @robocopyArguments
            $code = $LASTEXITCODE
            if ($code -gt 7) {
              throw "Copy from '$Source' to '$Destination' failed with ROBOCOPY code $code."
            }
            $global:LASTEXITCODE = 0
          }

          function Stop-ApiApplicationPool {
            Import-Module WebAdministration -ErrorAction Stop
            $appPoolName = 'ATS.FIP.API'
            $appPoolPath = "IIS:\AppPools\$appPoolName"

            if (-not (Test-Path -LiteralPath $appPoolPath)) {
              throw "Required IIS application pool does not exist: $appPoolName"
            }

            $state = (Get-WebAppPoolState -Name $appPoolName).Value
            if ($state -ne 'Stopped') {
              Write-Host "Stopping IIS application pool $appPoolName before deployment file copies. Current state: $state"
              Stop-WebAppPool -Name $appPoolName
            }

            for ($attempt = 1; $attempt -le 30; $attempt++) {
              $state = (Get-WebAppPoolState -Name $appPoolName).Value
              if ($state -eq 'Stopped') {
                Write-Host "IIS application pool $appPoolName is fully stopped."
                return
              }

              Start-Sleep -Seconds 1
            }

            throw "IIS application pool $appPoolName did not reach the Stopped state. Last state: $state"
          }

          function Start-ApiApplicationPool {
            Import-Module WebAdministration -ErrorAction Stop
            $appPoolName = 'ATS.FIP.API'
            $appPoolPath = "IIS:\AppPools\$appPoolName"

            if (-not (Test-Path -LiteralPath $appPoolPath)) {
              throw "Required IIS application pool does not exist: $appPoolName"
            }

            $state = (Get-WebAppPoolState -Name $appPoolName).Value
            if ($state -ne 'Started') {
              Write-Host "Starting IIS application pool $appPoolName. Current state: $state"
              Start-WebAppPool -Name $appPoolName
            }

            for ($attempt = 1; $attempt -le 30; $attempt++) {
              $state = (Get-WebAppPoolState -Name $appPoolName).Value
              if ($state -eq 'Started') {
                Write-Host "IIS application pool $appPoolName is started."
                return
              }

              Start-Sleep -Seconds 1
            }

            throw "IIS application pool $appPoolName did not reach the Started state. Last state: $state"
          }

          function Get-FileAccessDiagnostic {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string]$Role
            )

            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              return "$Role file '$Path' does not exist."
            }

            try {
              $stream = [IO.File]::Open(
                $Path,
                [IO.FileMode]::Open,
                [IO.FileAccess]::ReadWrite,
                [IO.FileShare]::None
              )
              $stream.Dispose()
              return "$Role file '$Path' can be opened exclusively; no restrictive file lock was detected."
            } catch {
              return "$Role file '$Path' could not be opened exclusively; a lock or access issue may be present: $($_.Exception.Message)"
            }
          }

          function Write-ApiDllCopyDiagnostics {
            param([Parameter(Mandatory = $true)][string]$ApiStageRoot)

            $apiDllName = 'Fip.Api.dll'
            $stagingApiDll = Join-Path $ApiStageRoot $apiDllName
            $destinationApiDll = Join-Path $env:API_DEST $apiDllName

            Write-Host (Get-FileAccessDiagnostic -Path $stagingApiDll -Role 'Staging API')
            Write-Host (Get-FileAccessDiagnostic -Path $destinationApiDll -Role 'IIS destination API')
          }

          function Get-FailureKind {
            param([Parameter(Mandatory = $true)][string]$Phase)

            if ($Phase -like '*health check*') {
              return 'Health-check'
            }

            if ($Phase -like '*copy*' -or $Phase -like '*manifest*') {
              return 'Copy'
            }

            return 'Deployment'
          }

          function Invoke-HealthCheck {
            param(
              [Parameter(Mandatory = $true)][string]$Uri,
              [Parameter(Mandatory = $true)][string]$Name,
              [switch]$ExpectJson
            )

            $lastError = 'No response received.'
            for ($attempt = 1; $attempt -le 12; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri $Uri -UseBasicParsing -TimeoutSec 15
                $status = [int]$response.StatusCode
                $responsePath = $response.BaseResponse.ResponseUri.AbsolutePath

                if ($status -eq 200 -and $responsePath -eq ([Uri]$Uri).AbsolutePath) {
                  if ($ExpectJson) {
                    $null = $response.Content | ConvertFrom-Json
                  }

                  Write-Host "$Name health check succeeded on attempt $attempt with HTTP $status at $responsePath."
                  return
                }

                $lastError = "HTTP $status at $responsePath."
              } catch {
                $lastError = $_.Exception.Message
              }

              Write-Host "$Name health check attempt $attempt failed: $lastError"
              if ($attempt -lt 12) {
                Start-Sleep -Seconds 5
              }
            }

            throw "$Name health check failed after 12 attempts. Last error: $lastError"
          }

          $webStage = Join-Path $env:DEPLOY_ROOT 'WEB'
          $apiStage = Join-Path $env:DEPLOY_ROOT 'API'
          $webBackup = Join-Path $env:DEPLOY_BACKUP 'WEB'
          $apiBackup = Join-Path $env:DEPLOY_BACKUP 'API'
          $webManifestName = '.fip-static-manifest.txt'
          $apiManifestName = '.fip-api-manifest.txt'
          $webManifest = Join-Path $env:FRONTEND_DEST $webManifestName
          $webBackupManifest = Join-Path $webBackup $webManifestName
          $apiManifest = Join-Path $env:API_DEST $apiManifestName
          $apiBackupManifest = Join-Path $apiBackup $apiManifestName
          # Deploy appsettings.json; preserve appsettings.Production.json and all other
          # environment-specific configuration and secret files managed by the server.
          $protectedApiPatterns = @('appsettings.*.json', 'secrets*.json', '.env*')

          $newWebFiles = @(Get-RelativeFiles -Root $webStage)
          $newApiFiles = @(Get-RelativeFiles -Root $apiStage -ExcludedFilePatterns $protectedApiPatterns)
          $oldWebManagedFiles = if (Test-Path -LiteralPath $webManifest -PathType Leaf) {
            @(Get-Content -LiteralPath $webManifest)
          } else {
            @()
          }
          $oldApiManagedFiles = if (Test-Path -LiteralPath $apiManifest -PathType Leaf) {
            @(Get-Content -LiteralPath $apiManifest)
          } else {
            @()
          }
          $oldWebBackupFiles = @(Get-RelativeFiles -Root $webBackup)
          $oldApiBackupFiles = @(Get-RelativeFiles -Root $apiBackup -ExcludedFilePatterns $protectedApiPatterns)
          $deploymentError = $null
          $deploymentPhase = 'Not started'
          $deploymentFailureKind = 'Deployment'

          try {
            $deploymentPhase = 'Taking API offline'
            New-Item -ItemType File -Path (Join-Path $env:API_DEST 'app_offline.htm') -Force -ErrorAction Stop | Out-Null

            $deploymentPhase = 'Stopping API application pool'
            Stop-ApiApplicationPool
            Start-Sleep -Seconds 2

            $deploymentPhase = 'Copying WEB files'
            Remove-ManagedFilesNotInSet -Root $env:FRONTEND_DEST -CurrentFiles $oldWebManagedFiles -AllowedFiles $newWebFiles
            Copy-Tree -Source $webStage -Destination $env:FRONTEND_DEST
            $newWebFiles | Set-Content -LiteralPath $webManifest -Encoding utf8

            $deploymentPhase = 'Copying API files'
            Remove-ManagedFilesNotInSet -Root $env:API_DEST -CurrentFiles $oldApiManagedFiles -AllowedFiles $newApiFiles -ProtectedPatterns $protectedApiPatterns
            Copy-Tree -Source $apiStage -Destination $env:API_DEST -ExcludedFiles @('appsettings.*.json', 'secrets*.json', '.env*')
            $newApiFiles | Set-Content -LiteralPath $apiManifest -Encoding utf8

            $deploymentPhase = 'Starting API application pool'
            Start-ApiApplicationPool

            $deploymentPhase = 'Removing API offline marker'
            Remove-Item -LiteralPath (Join-Path $env:API_DEST 'app_offline.htm') -Force -ErrorAction SilentlyContinue

            $deploymentPhase = 'Frontend health check'
            Invoke-HealthCheck -Uri 'https://fip.aviatechsystems.com/' -Name 'Frontend'

            $deploymentPhase = 'API health check'
            Invoke-HealthCheck -Uri 'https://fip.aviatechsystems.com/api/flights' -Name 'API' -ExpectJson
          } catch {
            $deploymentError = $_.Exception.ToString()
            $deploymentFailureKind = Get-FailureKind -Phase $deploymentPhase
            if ($deploymentPhase -eq 'Copying API files') {
              Write-ApiDllCopyDiagnostics -ApiStageRoot $apiStage
            }
            Write-Host "$deploymentFailureKind failure during deployment phase '$deploymentPhase'; starting rollback: $deploymentError"

            $rollbackPhase = 'Not started'
            $rollbackFailureKind = 'Deployment'
            try {
              $rollbackPhase = 'Taking API offline'
              New-Item -ItemType File -Path (Join-Path $env:API_DEST 'app_offline.htm') -Force -ErrorAction Stop | Out-Null

              $rollbackPhase = 'Stopping API application pool'
              Stop-ApiApplicationPool
              Start-Sleep -Seconds 2

              $rollbackPhase = 'Copying WEB backup'
              Copy-Tree -Source $webBackup -Destination $env:FRONTEND_DEST
              Remove-ManagedFilesNotInSet -Root $env:FRONTEND_DEST -CurrentFiles $newWebFiles -AllowedFiles $oldWebBackupFiles

              $rollbackPhase = 'Copying API backup'
              Copy-Tree -Source $apiBackup -Destination $env:API_DEST -ExcludedFiles @('appsettings.*.json', 'secrets*.json', '.env*')
              Remove-ManagedFilesNotInSet -Root $env:API_DEST -CurrentFiles $newApiFiles -AllowedFiles $oldApiBackupFiles -ProtectedPatterns $protectedApiPatterns

              if (Test-Path -LiteralPath $webBackupManifest -PathType Leaf) {
                Copy-Item -LiteralPath $webBackupManifest -Destination $webManifest -Force
              } else {
                Remove-Item -LiteralPath $webManifest -Force -ErrorAction SilentlyContinue
              }

              if (Test-Path -LiteralPath $apiBackupManifest -PathType Leaf) {
                Copy-Item -LiteralPath $apiBackupManifest -Destination $apiManifest -Force -ErrorAction Stop
              } else {
                Remove-Item -LiteralPath $apiManifest -Force -ErrorAction SilentlyContinue
              }

              $rollbackPhase = 'Starting API application pool'
              Start-ApiApplicationPool

              $rollbackPhase = 'Removing API offline marker'
              Remove-Item -LiteralPath (Join-Path $env:API_DEST 'app_offline.htm') -Force -ErrorAction Stop

              $rollbackPhase = 'Frontend rollback health check'
              Invoke-HealthCheck -Uri 'https://fip.aviatechsystems.com/' -Name 'Frontend rollback'

              $rollbackPhase = 'API rollback health check'
              Invoke-HealthCheck -Uri 'https://fip.aviatechsystems.com/api/flights' -Name 'API rollback' -ExpectJson
              Write-Host "Rollback completed and verification succeeded from $env:DEPLOY_BACKUP"
            } catch {
              $rollbackError = $_.Exception.ToString()
              $rollbackFailureKind = Get-FailureKind -Phase $rollbackPhase
              if ($rollbackPhase -eq 'Copying API backup') {
                Write-ApiDllCopyDiagnostics -ApiStageRoot $apiBackup
              }
              Write-Host "$rollbackFailureKind failure during rollback phase '$rollbackPhase'; the original deployment error was: $deploymentError"
              throw "Deployment failed during $deploymentFailureKind phase '$deploymentPhase' and rollback failed during $rollbackFailureKind phase '$rollbackPhase'. Original deployment error: $deploymentError Rollback error: $rollbackError"
            }

            throw "Deployment failed during $deploymentFailureKind phase '$deploymentPhase', but rollback completed. Original deployment error: $deploymentError"
          } finally {
            $restartError = $null
            try {
              Start-ApiApplicationPool
            } catch {
              $restartError = $_.Exception.ToString()
              Write-Host "API application pool restart failed during final recovery: $restartError"
            }

            Remove-Item -LiteralPath (Join-Path $env:API_DEST 'app_offline.htm') -Force -ErrorAction SilentlyContinue
            if ($restartError) {
              throw "API application pool could not be restarted during final recovery: $restartError"
            }
          }

      - name: Ensure app_offline.htm is removed
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $offlinePath = Join-Path $env:API_DEST 'app_offline.htm'
          if (Test-Path -LiteralPath $offlinePath) {
            try {
              Remove-Item -LiteralPath $offlinePath -Force
              Write-Host 'Removed app_offline.htm during final recovery.'
            } catch {
              throw "Final app_offline.htm cleanup failed: $($_.Exception.Message)"
            }
          }

      - name: Clean deployment staging
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DEPLOY_ROOT -and (Test-Path -LiteralPath $env:DEPLOY_ROOT)) {
            Remove-Item -LiteralPath $env:DEPLOY_ROOT -Recurse -Force
          }
