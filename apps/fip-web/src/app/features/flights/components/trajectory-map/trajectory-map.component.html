<div #mapShell class="map-shell">
  @if (validCoordinates.length === 0) {
    <p class="map-empty" role="status">Trajectory data is unavailable for this flight.</p>
  } @else {
    <button class="map-fullscreen-button" type="button" [attr.aria-label]="isFullscreen ? 'Exit fullscreen map' : 'Open map in fullscreen'" [attr.title]="isFullscreen ? 'Exit fullscreen' : 'Open fullscreen'" (click)="toggleFullscreen()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5" /></svg>
    </button>
  }
  <div #mapContainer class="map-container" [class.map-container--hidden]="validCoordinates.length === 0"></div>
</div>
